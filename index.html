<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock en Almacenes - Latinbien</title>
<style>
  :root { --azul:#0f3b6e; --verde:#1e8e5a; --naranja:#e07b2a; --gris:#eef1f5; --borde:#d3dae3; }
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", Arial, sans-serif; margin: 0; background: #f4f6f9; color: #1c2733; }
  header { background: var(--azul); color: #fff; padding: 14px 22px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  .sub { font-size: 12px; opacity: .85; }
  main { padding: 20px; max-width: 1200px; margin: 0 auto; }
  .barra { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .barra select, .barra button { font-size: 14px; padding: 7px 10px; border: 1px solid var(--borde); border-radius: 6px; }
  button { cursor: pointer; }
  .tarjeta { background: #fff; border: 1px solid var(--borde); border-radius: 10px; padding: 16px; margin-bottom: 18px; }
  .tarjeta h2 { margin: 0 0 12px; font-size: 15px; color: var(--azul); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--gris); padding: 8px 10px; text-align: left; }
  th { background: #f8fafc; color: #56657a; font-weight: 600; }
  .num { text-align: center; font-variant-numeric: tabular-nums; }
  .b { border-radius:6px; padding: 2px 9px; font-size: 13px; line-height: 1.4; border: 1px solid var(--borde); background:#fff; }
  .pill { display:inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  .pill.ok { background:#e2f6ea; color:#186a3a; }
  .pill.med { background:#fff3d6; color:#92600a; }
  .pill.old { background:#fde0e0; color:#8a1d1d; }
  .mini-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .mini { background:#f8fafc; border:1px solid var(--borde); border-radius:8px; padding:10px; text-align:center; }
  .mini b { display:block; font-size:17px; color:var(--azul); }
  .mini span { font-size:11px; color:#56657a; }
  .mini.loc { cursor:pointer; }
  .mini.loc:hover { border-color:var(--azul); background:#eef4ff; }
  .bar-fondo { background: var(--gris); border-radius: 8px; height: 16px; min-width: 100px; position: relative; }
  .bar-fondo > i { display:block; height: 16px; border-radius: 8px; background: var(--naranja); }
  .aviso { color:#8a1d1d; font-weight:600; }
  .fila-ant { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--gris); font-size:13px; }
  .fila-ant .nom { flex:1 1 320px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .fila-ant .graf { flex:2 1 auto; background:var(--gris); border-radius:6px; height:14px; position:relative; }
  .fila-ant .graf > i { display:block; height:14px; border-radius:6px; background:var(--azul); }
  .fila-ant .grafo { border-radius:6px; background:var(--naranja); height:14px; }
  .fila-ant .dias { width:110px; text-align:right; font-variant-numeric:tabular-nums; font-weight:600; color:#56657a; }
  .top-ant { margin:0 0 4px; font-size:12px; color:#56657a; }
  .boton-excel { background:var(--verde); color:#fff; border:none; font-weight:600; }
  .boton-excel:hover { filter:brightness(1.08); }
</style>
</head>
<body>
<header>
  <h1>Stock en Almacenes &#8226; Latinbien</h1>
  <span class="sub">Dato de origen: Odoo <i>stock.quant</i> (campo <b>in_date</b> = fecha de recepci&oacute;n)</span>
</header>

<main>
  <section class="tarjeta">
    <h2>Stock disponible (antig&uuml;edad en almac&eacute;n)</h2>
    <p class="sub" id="stock-sync"></p>
    <div id="stock-tarjetas"></div>

    <div id="estrategias"></div>
    <div class="barra">
      <label>Almac&eacute;n:

      </label>
      <label>Antig&uuml;edad:

      </label>
      <button id="btn-stock-orden" class="b">Ordenar: m&aacute;s tiempo primero</button>
      <button id="btn-excel" class="b boton-excel">Exportar a Excel</button>
      <span class="sub" id="stock-resumen"></span>
    </div>
    <div id="stock-antiguos" class="tarjeta" style="border:1px solid var(--borde);border-radius:8px;padding:14px;margin-bottom:16px">
      <h2 style="margin:0 0 10px;font-size:14px;color:var(--azul)">Productos m&aacute;s antiguos en almac&eacute;n</h2>
      <div id="stock-ant-list"></div>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th>Producto</th><th class="num">C&oacute;digo</th><th class="num">Lote/Serie</th>
          <th>Almac&eacute;n</th><th class="num">F. Recepci&oacute;n</th>

          <th class="num">Disponible</th><th>Estrategia</th>
        </tr></thead>
        <tbody id="tbody-stock"></tbody>
      </table>
    </div>
  </section>
</main>

function filtroActual() {
  const a = String(document.getElementById("sel-almacen").value);

function pintarAntiguos() {
  const tops = filtroActual()
    .filter(r => r.age_days !== null && r.age_days !== undefined)
    .sort((x, y) => (y.age_days - x.age_days) || (Number(y.available) - Number(x.available)))
    .slice(0, 10);
  const el = document.getElementById("stock-ant-list");
  const max = Math.max(1, ...tops.map(r => r.age_days));
  if (!tops.length) { el.innerHTML = '<span class="sub">Sin datos de antig&uuml;edad.</span>'; return; }
  el.innerHTML = '<p class="top-ant">Top 10 con m&aacute;s d&iacute;as en almac&eacute;n (unidades disponibles por lote):</p>' +
    tops.map(r =>
      '<div class="fila-ant">' +
      '<div class="nom" title="' + r.product_name + " / " + (r.lot_name || "") + '">' +
      String(r.product_name).split("]")[0] + (String(r.product_name).indexOf("]") >= 0 ? "]" : "") +
      ' <span style="color:#8a93a3;font-size:11px">' + (r.lot_name || "") + "</span></div>" +
      '<div class="graf"><i style="width:' + Math.round(r.age_days / max * 100) + '%">&nbsp;</i></div>' +
      '<div class="dias">' + r.age_days + " d&iacute;as &middot; " + r.available + "</div>" +
      "</div>").join("");
}

function pintarStock() {

    .filter(r => (a === "TODOS" || String(r.location_id) === a) && (!b || r.bucket === b))
    .sort((x, y) => {
      const xa = x.age_days === null || x.age_days === undefined ? -1 : x.age_days;
