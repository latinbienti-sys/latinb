<style>
  :root { --azul:#0f3b6e; --verde:#1e8e5a; --naranja:#e07b2a; --gris:#eef1f5; --borde:#d3dae3; }
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", Arial, sans-serif; margin: 0; background: #f4f6f9; color: #1c2733; }
  header { background: var(--azul); color: #fff; padding: 14px 22px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  .sub { font-size: 12px; opacity: .85; }
  main { padding: 20px; max-width: 1200px; margin: 0 auto; }
  .barra { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .barra select, .barra button { font-size: 14px; padding: 7px 10px; border: 1px solid var(--borde); border-radius: 6px; }
  button { cursor: pointer; }
  .tarjeta { background: #fff; border: 1px solid var(--borde); border-radius: 10px; padding: 16px; margin-bottom: 18px; }
  .tarjeta h2 { margin: 0 0 12px; font-size: 15px; color: var(--azul); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--gris); padding: 8px 10px; text-align: left; }
  th { background: #f8fafc; color: #56657a; font-weight: 600; }
  .num { text-align: center; font-variant-numeric: tabular-nums; }
  .b { border-radius:6px; padding: 2px 9px; font-size: 13px; line-height: 1.4; border: 1px solid var(--borde); background:#fff; }
  .pill { display:inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  .pill.ok { background:#e2f6ea; color:#186a3a; }
  .pill.med { background:#fff3d6; color:#92600a; }
  .pill.old { background:#fde0e0; color:#8a1d1d; }
  .mini-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .mini { background:#f8fafc; border:1px solid var(--borde); border-radius:8px; padding:10px; text-align:center; }
  .mini b { display:block; font-size:17px; color:var(--azul); }
  .mini span { font-size:11px; color:#56657a; }
  .mini.loc { cursor:pointer; }
  .mini.loc:hover { border-color:var(--azul); background:#eef4ff; }
  .bar-fondo { background: var(--gris); border-radius: 8px; height: 16px; min-width: 100px; position: relative; }
  .bar-fondo > i { display:block; height: 16px; border-radius: 8px; background: var(--naranja); }
  .aviso { color:#8a1d1d; font-weight:600; }
</style>

<header>
  <h1>Stock en Almacenes &#8226; Latinbien</h1>

    <div class="barra">

    </div>
  </section>
</main>

  selA.innerHTML = '<option value="TODOS">Todos los almacenes</option>' +
    stockData.locations.map(l => '<option value="' + l.location_id + '">' + l.location_name + "</option>").join("");
  const selB = document.getElementById("sel-antiguedad");
  selB.innerHTML = '<option value="">Todas</option>' +
    stockData.bucket_labels.map(b => "<option>" + b + "</option>").join("");

  document.getElementById("stock-tarjetas").innerHTML =
    '<div class="mini-grid">' +
    '<div class="mini"><b>' + (g.total_units || 0) + '</b><span>Unidades disponibles</span></div>' +
    '<div class="mini"><b>' + (g.total_items || 0) + '</b><span>Productos/lotes en stock</span></div>' +
    '<div class="mini"><b>US$' + Number(g.total_value || 0).toLocaleString("en-US", {maximumFractionDigits: 0}) + '</b><span>Valor total (compra)</span></div>' +
    '<div class="mini"><b>' + (g.max_age || 0) + '</b><span>D&iacute;as m&aacute;x. en almac&eacute;n</span></div>' +
    '<div class="mini"><b>' + stockData.locations.length + '</b><span>Almacenes</span></div>' +
    "</div>" +
    '<div class="mini-grid" id="stock-buckets"></div>' +
    '<div class="mini-grid" id="stock-loc"></div>';

  const bmax = Math.max(1, ...stockData.bucket_labels.map(b => (g.buckets || {})[b] || 0));
  document.getElementById("stock-buckets").innerHTML = stockData.bucket_labels.map(b => {
    const v = (g.buckets || {})[b] || 0;
    return '<div class="mini" style="text-align:left">' +
      '<div class="bar-fondo"><i style="width:' + Math.round(v / bmax * 100) + '%">&nbsp;</i></div>' +
      '<span>' + b + ': <b>' + v + '</b></span></div>';
  }).join("");

  document.getElementById("stock-loc").innerHTML = stockData.locations.map(l =>
    '<div class="mini loc" data-loc="' + l.location_id + '">' +
    '<span>' + String(l.location_name).split("/")[0] + '</span>' +
    '<b>' + l.total_units + '</b><span>unid &middot; m&aacute;x ' + l.max_age + ' d&iacute;as</span></div>').join("") ||
    '<div class="mini"><span>Sin almacenes</span></div>';

  document.querySelectorAll("#stock-loc .loc").forEach(c =>
    c.onclick = () => { selA.value = c.dataset.loc; pintarStock(); });
  selA.onchange = pintarStock;
  selB.onchange = pintarStock;
  document.getElementById("btn-stock-orden").onclick = () => {
    stockDesc = !stockDesc;
    document.getElementById("btn-stock-orden").textContent =
      stockDesc ? "Ordenar: m&aacute;s tiempo primero" : "Ordenar: m&aacute;s reciente primero";
    pintarStock();
  };

  const est = stockData.estrategias || {};
  const res = stockData.resumen || {};
  document.getElementById("estrategias").innerHTML =
    '<p class="sub" style="font-weight:600;color:var(--azul);margin:4px 0 8px">' +
    'Estrategia sugerida seg&uacute;n el tiempo en almac&eacute;n y el valor de compra (costo Odoo)</p>' +
    '<div class="mini-grid">' + stockData.bucket_labels.map(b => {
      const rr = res[b] || {};
      return '<div class="mini" style="text-align:left;padding:12px">' +
        '<b style="font-size:13px">' + b + '</b>' +
        '<span>' + (rr.unidades || 0) + ' ud &middot; US$' + Number(rr.valor || 0).toLocaleString("en-US", {maximumFractionDigits: 0}) + '</span>' +
        '<p style="margin:6px 0 0;font-size:11.5px;color:#3a4a5c;text-align:left;line-height:1.4">' + (est[b] || "") + '</p></div>';
    }).join("") + '</div>';

  pintarStock();
}

function pintarStock() {
  const a = String(document.getElementById("sel-almacen").value);
  const b = document.getElementById("sel-antiguedad").value;
  const orden = stockDesc ? -1 : 1;
  const lista = stockData.rows
    .filter(r => (a === "TODOS" || String(r.location_id) === a) && (!b || r.bucket === b))
    .sort((x, y) => {
      const xa = x.age_days === null || x.age_days === undefined ? -1 : x.age_days;
      const ya = y.age_days === null || y.age_days === undefined ? -1 : y.age_days;
      return (xa - ya) * orden;
    });
  const pill = d => {
    if (d === null || d === undefined) return '<span class="pill">Sin fecha</span>';
    const clase = d <= 30 ? "ok" : (d <= 90 ? "med" : "old");
    return '<span class="pill ' + clase + '">' + d + " d&iacute;as</span>";
  };
  const totalUnid = lista.reduce((s, r) => s + Number(r.available || 0), 0);
  const totalValor = lista.reduce((s, r) => s + Number(r.value || 0), 0);
  document.getElementById("stock-resumen").innerHTML =
    lista.length + " productos/lotes &middot; " + totalUnid.toFixed(2) + " unidades &middot; US$" +
    totalValor.toLocaleString("en-US", {maximumFractionDigits: 0}) + " valor de compra";
  document.getElementById("tbody-stock").innerHTML = lista.map(r =>
    "<tr>" +
    "<td>" + r.product_name + "</td>" +
    '<td class="num">' + (r.default_code || "") + "</td>" +
    '<td class="num">' + (r.lot_name || "&mdash;") + "</td>" +
    "<td>" + r.location_name + "</td>" +
    '<td class="num">' + (r.in_date ? String(r.in_date).slice(0, 10) : "&mdash;") + "</td>" +
    '<td class="num">' + pill(r.age_days) + "</td>" +
    '<td class="num">US$' + Number(r.value || 0).toFixed(2) + "</td>" +
    '<td class="num"><b>' + r.available + "</b></td>" +
    '<td style="font-size:12px;color:#3a4a5c">' + (r.strategy || "") + "</td>" +
    "</tr>").join("") ||
    '<tr><td colspan="9" class="aviso">Sin stock disponible para el filtro seleccionado.</td></tr>';
}

document.addEventListener("DOMContentLoaded", prepara);
</script>
</body>
</html>
